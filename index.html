<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wall Clock">
<style>
* { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
html { font-size: 1vw; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }
body {
font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight: 200;
-webkit-user-select: none; user-select: none;
-webkit-touch-callout: none;
-webkit-tap-highlight-color: transparent;
cursor: default;
}
.dim { color: #8e8e93; }
#sky { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
#top, #rule, #vibe, #train, #call, #status { z-index: 1; }
#top { position: absolute; left: 5vw; right: 5vw; top: 5vh; height: 36vh; }
#clock { position: absolute; left: 0; top: 0; }
#time { font-size: 15rem; line-height: 1; font-weight: 100; letter-spacing: -0.02em; }
#ampm { font-size: 3.2rem; margin-left: 0.6rem; }
#date { font-size: 2.8rem; margin-top: 1.2vh; }
#weather { position: absolute; right: 0; top: 0; text-align: right; }
#wrow { height: 15rem; white-space: nowrap; }
#wicon { display: inline-block; vertical-align: middle; width: 13rem; height: 13rem; margin-right: 2rem; }
#temp { display: inline-block; vertical-align: middle; font-size: 15rem; line-height: 1; font-weight: 100; }
#wtext { font-size: 2.8rem; margin-top: 1.2vh; }
#wmore { font-size: 2.4rem; margin-top: 0.8vh; }
#rain.wet { color: #64d2ff; }
#rule { position: absolute; left: 5vw; right: 5vw; top: 45vh; height: 1px; background: #2c2c2e; }
#train { position: absolute; left: 5vw; right: 5vw; top: 49vh; bottom: 4vh; }
#line { font-size: 3.2rem; height: 6rem; line-height: 6rem; white-space: nowrap; }
#bullet {
display: inline-block; width: 6rem; height: 6rem; line-height: 6rem; border-radius: 50%;
background: #ff6319; color: #fff; text-align: center;
font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 3.8rem;
margin-right: 1.6rem; vertical-align: top;
}
#vibe { position: absolute; left: 0; right: 0; top: 45vh; margin-top: -4rem; height: 3.2rem; line-height: 3.2rem; text-align: center; font-size: 2.3rem; font-style: italic; color: #aeaeb2; }
#mins.missed { color: #636366; }
#trip { position: absolute; right: 0; top: 0; text-align: right; white-space: nowrap; }
#trip .t1 { font-size: 8.5rem; line-height: 1; font-weight: 200; letter-spacing: -0.02em; }
#trip .t1 svg { width: 6rem; height: 6rem; margin-right: 1.6rem; vertical-align: -0.2rem; }
#trip .t1 small { font-size: 2.6rem; color: #8e8e93; margin-left: 0.6rem; letter-spacing: 0; }
#trip .row { position: relative; height: 3.6rem; margin-top: 1rem; }
#trip .bar { position: absolute; left: 0; right: 0; top: 50%; height: 0.6rem; margin-top: -0.3rem; }
#trip .t2 + .bar { right: 13.5rem; }
#trip .bar:before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #2c2c2e; }
#trip .bar i { position: absolute; top: 0; bottom: 0; border-radius: 0.3rem; }
#trip .t2 { position: absolute; right: 0; top: 0; line-height: 3.6rem; font-size: 3.2rem; font-weight: 300; color: #8e8e93; }
#trip .t2 svg { width: 3.2rem; height: 3.2rem; margin-right: 0.8rem; vertical-align: -0.5rem; opacity: 0.55; }
#next { position: absolute; left: 0; bottom: 0; white-space: nowrap; line-height: 0.8; }
#mins { font-size: 30rem; font-weight: 700; letter-spacing: -0.03em; }
#mins.now { font-size: 24rem; }          /* the word is much wider than the digits */
#unit { font-size: 5rem; margin-left: 1.5rem; }
/* Right column: arrival times on top, a hairline, then "NEXT TRAINS". */
.label { font-size: 1.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #8e8e93; font-weight: 400; }
#later { position: absolute; right: 0; bottom: 0.4rem; text-align: right; min-width: 28rem; border-top: 1px solid #2c2c2e; padding-top: 1rem; }
#laterlabel { line-height: 1.6; }
#latervals { font-size: 7rem; font-weight: 200; line-height: 1.15; }
#latervals small { font-size: 2.6rem; color: #8e8e93; margin-left: 0.6rem; }
#latervals i {
display: inline-block; width: 4.4rem; height: 4.4rem; line-height: 4.4rem; border-radius: 50%;
text-align: center; font-style: normal; font-family: Helvetica, Arial, sans-serif;
font-weight: bold; font-size: 2.7rem; margin-right: 1.4rem; vertical-align: 0.9rem;
}
#status { position: absolute; left: 5vw; bottom: 1vh; font-size: 1.6rem; color: #ff453a; }
#call {
position: absolute; left: 5vw; top: 33vh; display: none;
font-size: 2.4rem; color: #30d158; border: 1px solid #30d158; border-radius: 4rem;
padding: 1rem 2.4rem; text-decoration: none;
}
@keyframes spin  { from { -webkit-transform: rotate(0deg); transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
@keyframes drift { 0% { -webkit-transform: translateX(-3px); transform: translateX(-3px); } 50% { -webkit-transform: translateX(3px); transform: translateX(3px); } 100% { -webkit-transform: translateX(-3px); transform: translateX(-3px); } }
@keyframes fall  { 0% { -webkit-transform: translateY(-6px); transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; } 100% { -webkit-transform: translateY(12px); transform: translateY(12px); opacity: 0; } }
@keyframes flash { 0%, 86%, 100% { opacity: 0.25; } 90%, 94% { opacity: 1; } 92% { opacity: 0.3; } }
@keyframes glow  { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
.rays  { -webkit-transform-origin: 50px 50px; transform-origin: 50px 50px; -webkit-animation: spin 40s linear infinite; animation: spin 40s linear infinite; }
.cloud { -webkit-animation: drift 9s ease-in-out infinite; animation: drift 9s ease-in-out infinite; }
.drop  { -webkit-animation: fall 1.1s linear infinite; animation: fall 1.1s linear infinite; }
.flake { -webkit-animation: fall 2.6s linear infinite; animation: fall 2.6s linear infinite; }
.d2 { -webkit-animation-delay: 0.35s; animation-delay: 0.35s; }
.d3 { -webkit-animation-delay: 0.7s; animation-delay: 0.7s; }
.bolt  { -webkit-animation: flash 5s linear infinite; animation: flash 5s linear infinite; }
.moon, .fogl { -webkit-animation: glow 6s ease-in-out infinite; animation: glow 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
.rays, .cloud, .drop, .flake, .bolt, .moon, .fogl { -webkit-animation: none; animation: none; }
}
/* Portrait (set by fit() in the script): clock top-left, weather bottom-right,
   arrival under the station, the "then" list as one row above the big minutes. */
.tall #top { left: 6vw; right: 6vw; top: 4vh; height: 37vh; }
.tall #weather { top: auto; bottom: 0; }
.tall #time { font-size: 14rem; }
.tall #wrow { height: 10rem; }
.tall #wicon { width: 8.5rem; height: 8.5rem; }
.tall #temp { font-size: 10rem; }
.tall #rule { left: 6vw; right: 6vw; top: 47vh; }
.tall #vibe { top: 47vh; }
.tall #train { left: 6vw; right: 6vw; top: 50vh; }
.tall #status { left: 6vw; }
.tall #trip { top: 8rem; }
.tall #mins { font-size: 18rem; }
.tall #unit { font-size: 4rem; }
.tall #later { top: 22rem; bottom: auto; }
.tall #latervals { font-size: 5rem; }
.tall #latervals div { display: inline-block; margin-left: 3rem; }
.tall #latervals i { width: 3.4rem; height: 3.4rem; line-height: 3.4rem; font-size: 2.1rem; vertical-align: 0.5rem; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="top">
<div id="clock">
<div><span id="time">--:--</span><span id="ampm" class="dim"></span></div>
<div id="date" class="dim">&nbsp;</div>
</div>
<div id="weather">
<div id="wrow"><span id="wicon"></span><span id="temp">--&deg;</span></div>
<div id="wtext" class="dim">&nbsp;</div>
<div id="wmore" class="dim">&nbsp;</div>
</div>
</div>
<div id="rule"></div>
<div id="vibe"></div>
<div id="train">
<div id="line"><span id="bullet">D</span><span id="where" class="dim">&nbsp;</span></div>
<div id="trip"></div>
<div id="next"><span id="mins">--</span><span id="unit" class="dim">min</span></div>
<div id="later">
<div id="laterlabel" class="label">Next trains</div>
<div id="latervals">&nbsp;</div>
</div>
</div>
<a id="call" href="#">Call home</a>
<div id="status"></div>
<script>
(function () {
var data = null;
var gotAt = 0;
var shownKind = '';
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
'August', 'September', 'October', 'November', 'December'];
var COLORS = { B: '#ff6319', D: '#ff6319', F: '#ff6319', M: '#ff6319',
N: '#fccc0a', Q: '#fccc0a', R: '#fccc0a', W: '#fccc0a' };
function el(id) { return document.getElementById(id); }
function set(id, text) { var e = el(id); if (e.textContent !== text) { e.textContent = text; } }
// Every size is in rem, and 1rem is set here so the layout fits any screen.
// Landscape keeps the 4:3 iPad proportions (1rem = 1% of the width, or of
// 4/3 of the height on wider screens); portrait switches to a stacked layout.
function fit() {
var w = window.innerWidth, h = window.innerHeight, tall = w / h < 0.8;
document.documentElement.style.fontSize = (tall ? Math.min(w / 47.6, h / 100) : Math.min(w / 100, h / 75)) + 'px';
document.documentElement.className = tall ? 'tall' : '';
}
fit();
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
var CLOUD = '<path class="cloud" fill="#d1d1d6" d="M30 66h42a14 14 0 0 0 1-28 20 20 0 0 0-38-4 16 16 0 0 0-5 32z"/>';
var SUN = '<g class="rays" stroke="#ffd60a" stroke-width="3" stroke-linecap="round">' +
'<line x1="50" y1="8" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="92"/>' +
'<line x1="8" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="92" y2="50"/>' +
'<line x1="20" y1="20" x2="27" y2="27"/><line x1="73" y1="73" x2="80" y2="80"/>' +
'<line x1="20" y1="80" x2="27" y2="73"/><line x1="73" y1="27" x2="80" y2="20"/></g>' +
'<circle cx="50" cy="50" r="20" fill="#ffd60a"/>';
var MOON = '<path class="moon" fill="#e5e5ea" d="M62 20a32 32 0 1 0 18 44 26 26 0 0 1-18-44z"/>';
function drops(cls, color, round) {
var xs = [34, 50, 66], out = '';
for (var i = 0; i < 3; i++) {
out += round
? '<circle class="' + cls + ' d' + (i + 1) + '" cx="' + xs[i] + '" cy="78" r="3" fill="' + color + '"/>'
: '<line class="' + cls + ' d' + (i + 1) + '" x1="' + xs[i] + '" y1="74" x2="' + (xs[i] - 3) + '" y2="84" stroke="' + color + '" stroke-width="3" stroke-linecap="round"/>';
}
return out;
}
function icon(kind, isDay) {
var inner;
if (kind === 'rain') { inner = CLOUD + drops('drop', '#64d2ff', false); }
else if (kind === 'snow') { inner = CLOUD + drops('flake', '#ffffff', true); }
else if (kind === 'storm') { inner = CLOUD + '<path class="bolt" fill="#ffd60a" d="M52 66l-10 16h8l-4 14 14-20h-8l6-10z"/>'; }
else if (kind === 'cloudy') { inner = CLOUD; }
else if (kind === 'fog') {
inner = '<g class="fogl" stroke="#d1d1d6" stroke-width="4" stroke-linecap="round">' +
'<line x1="20" y1="36" x2="80" y2="36"/><line x1="26" y1="50" x2="74" y2="50"/>' +
'<line x1="20" y1="64" x2="80" y2="64"/></g>';
}
else if (kind === 'partly') {
inner = '<g transform="translate(18 -12) scale(0.7)">' + (isDay ? SUN : MOON) + '</g>' +
'<g transform="translate(-6 10)">' + CLOUD + '</g>';
}
else { inner = isDay ? SUN : MOON; }
return '<svg viewBox="0 0 100 100" width="100%" height="100%">' + inner + '</svg>';
}
function drawClock() {
var d = new Date();
var h = d.getHours(), m = d.getMinutes();
set('ampm', h < 12 ? 'AM' : 'PM');
h = h % 12; if (h === 0) { h = 12; }
set('time', h + ':' + (m < 10 ? '0' : '') + m);
set('date', DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate());
if (d.getHours() === 4 && m === 0 && d.getSeconds() < 2 && Date.now() - loadedAt > 120000) {
freshReload();
}
}
var loadedAt = Date.now();
function bulletHTML(route) {
var bg = COLORS[route] || '#8e8e93';
return '<i style="background:' + bg + ';color:' + (bg === '#fccc0a' ? '#000' : '#fff') + '">' + route + '</i>';
}
function clockText(sec) {
var d = new Date(sec * 1000), h = d.getHours() % 12 || 12, m = d.getMinutes();
return h + ':' + (m < 10 ? '0' : '') + m;
}
// Arrival at DEST_STOP for one train from home: directly if it stops there,
// otherwise via the connection at XFER_STOP that arrives soonest, using each
// trip's own predictions. eta is 0 when no connection is predicted yet.
function etaFor(t) {
var leg = { board: t.at[STOP_ID].d, route: t.route, eta: 0 };
if (t.at[DEST_STOP]) { leg.eta = t.at[DEST_STOP].a; return leg; }
var ready = t.at[XFER_STOP].a + XFER_MIN * 60, best = null, j, u;
for (j = 0; j < data.trips.length; j++) {
u = data.trips[j];
if (u === t || !u.at[XFER_STOP] || !u.at[DEST_STOP]) { continue; }
if (u.at[XFER_STOP].d < ready || u.at[DEST_STOP].a <= u.at[XFER_STOP].d) { continue; }
if (!best || u.at[DEST_STOP].a < best.at[DEST_STOP].a) { best = u; }
}
leg.change = t.at[XFER_STOP].a;
if (best) { leg.eta = best.at[DEST_STOP].a; leg.leave = best.at[XFER_STOP].d; leg.route2 = best.route; }
return leg;
}
// Arrival times for the next two trains from home that are still at least
// ETA_MIN minutes away; under that, the estimate moves on to the next train.
function etas(now) {
var home = [], out = [], i, t;
for (i = 0; i < data.trips.length; i++) {
t = data.trips[i];
if (t.at[STOP_ID] && (t.at[DEST_STOP] || t.at[XFER_STOP]) && t.at[STOP_ID].d - now >= ETA_MIN * 60) { home.push(t); }
}
home.sort(function (a, b) { return a.at[STOP_ID].d - b.at[STOP_ID].d; });
for (i = 0; i < home.length && i < 2; i++) { out.push(etaFor(home[i])); }
return out;
}
// Mortarboard, drawn like the weather icons, so the time reads as "at uni".
var CAP = '<svg viewBox="0 0 100 100"><path fill="#aeaeb2" d="M26 50v15c0 8 11 13 24 13s24-5 24-13V50L50 61z"/>' +
'<path fill="#e5e5ea" d="M50 22l44 19-44 19L6 41z"/>' +
'<path fill="none" stroke="#ffd60a" stroke-width="3" stroke-linecap="round" d="M50 41l32 6v18"/>' +
'<circle cx="82" cy="69" r="4.5" fill="#ffd60a"/></svg>';
// Journey bar from now to arrival: grey until the train leaves, then each
// ride in its line's colour, with the change at Atlantic as the gap between.
function barHTML(leg, now) {
var span = leg.eta - now, out = '', parts = [[now, leg.board, '#3a3a3c']], i, a, b;
if (span <= 0) { return ''; }
if (leg.leave) { parts.push([leg.board, leg.change, COLORS[leg.route] || '#8e8e93'], [leg.leave, leg.eta, COLORS[leg.route2] || '#8e8e93']); }
else { parts.push([leg.board, leg.eta, COLORS[leg.route] || '#8e8e93']); }
for (i = 0; i < parts.length; i++) {
a = Math.round((parts[i][0] - now) / span * 200) / 2;
b = Math.round((parts[i][1] - now) / span * 200) / 2;
if (b - a > 0.6) { out += '<i style="left:' + a + '%;width:' + (b - a - 0.6) + '%;background:' + parts[i][2] + '"></i>'; }
}
return out;
}
var tripHTML = '';
function drawJourney(now) {
var e = DEST_STOP && data.trips ? etas(now) : [], html = '';
if (e.length) {
html = '<div class="t1">' + CAP + (e[0].eta ? clockText(e[0].eta) + '<small>' +
(new Date(e[0].eta * 1000).getHours() < 12 ? 'AM' : 'PM') + '</small>' : '--') + '</div>' +
'<div class="row">' + (e.length > 1 ? '<span class="t2">' + CAP + (e[1].eta ? clockText(e[1].eta) : '--') + '</span>' : '') +
(e[0].eta ? '<div class="bar">' + barHTML(e[0], now) + '</div>' : '') + '</div>';
}
if (html !== tripHTML) { el('trip').innerHTML = html; tripHTML = html; }
}
function drawTrain() {
var fresh = data && data.trips && (Date.now() - gotAt) < 90000;
if (!fresh) {
set('mins', '--'); set('unit', 'min'); el('unit').style.display = '';
set('latervals', ' ');
el('mins').className = '';
if (tripHTML) { el('trip').innerHTML = tripHTML = ''; }
set('status', trainErr ? 'No live train data – ' + trainErr : 'Connecting…');
return;
}
set('status', '');
set('where', data.direction + '  ·  ' + data.stop);
var now = Date.now() / 1000;
var list = [];
for (var i = 0; i < data.trips.length; i++) {
var at = data.trips[i].at[STOP_ID];
if (!at) { continue; }
var mins = Math.floor((at.d - now) / 60);
if (mins >= 0) { list.push({ route: data.trips[i].route, mins: mins, time: at.d }); }
}
list.sort(function (a, b) { return a.time - b.time; });
drawJourney(now);
if (!list.length) {
set('mins', '--'); el('unit').style.display = ''; set('unit', 'no trains listed');
el('mins').className = '';
set('latervals', ' ');
return;
}
var first = list[0];
set('bullet', first.route || 'D');
el('bullet').style.background = COLORS[first.route] || '#ff6319';
el('bullet').style.color = COLORS[first.route] === '#fccc0a' ? '#000' : '#fff';
if (first.mins === 0) {
set('mins', 'Now'); el('unit').style.display = 'none';
} else {
set('mins', String(first.mins)); el('unit').style.display = ''; set('unit', 'min');
}
var walk = data.walkMin || 0;
el('mins').className = ((walk && first.mins < walk) ? 'missed' : '') + (first.mins === 0 ? ' now' : '');
var html = '', mixed = false, j;
for (j = 1; j < list.length && j < 3; j++) {
if (list[j].route !== first.route) { mixed = true; }
}
for (j = 1; j < list.length && j < 3; j++) {
var bg = COLORS[list[j].route] || '#8e8e93';
html += '<div>' + (mixed ? bulletHTML(list[j].route) : '') + list[j].mins + '<small>min</small></div>';
}
var lv = el('latervals');
if (lv.innerHTML !== html) { lv.innerHTML = html || ' '; }
el('laterlabel').style.visibility = html ? 'visible' : 'hidden';
}
function drawWeather() {
var w = data && data.weather;
if (!w) { return; }
set('temp', (w.temp === null ? '--' : w.temp) + '°');
set('wtext', w.text || ' ');
var key = w.kind + (w.isDay ? 'd' : 'n');
if (key !== shownKind) { el('wicon').innerHTML = icon(w.kind, w.isDay); shownKind = key; }
var vb = el('vibe'), vhtml = w.vibe ? '<span></span>' : '';
if (vb.getAttribute('data-v') !== (w.vibe || '')) {
vb.innerHTML = vhtml;
if (w.vibe) { vb.firstChild.textContent = w.vibe; }
vb.setAttribute('data-v', w.vibe || '');
}
setSky(data.animate ? w.kind : 'off');
var more = '';
if (w.high !== null) { more += 'H ' + w.high + '°   '; }
if (w.low !== null) { more += 'L ' + w.low + '°   '; }
el('wmore').innerHTML = more.replace(/ {3}/g, '&nbsp;&nbsp;&nbsp;') +
'<span id="rain"' + (w.rain >= 40 ? ' class="wet"' : '') + '>Rain ' + w.rain + '%</span>';
}
// ---- Background sky ---------------------------------------------------------
// Back to front: colour wash (follows the real sun), sun glow, stars, clouds,
// fog, rain/snow, lightning. Each layer has an intensity that eases toward a
// target picked from the forecast, so weather changes crossfade over a few
// seconds instead of popping, and a new forecast mid-fade just retargets.
var sky = el('sky'), ctx = sky.getContext('2d');
var wash = document.createElement('canvas'), wctx = wash.getContext('2d');
var W = 0, H = 0, WASH = 8;           // wash renders at 1/8 size and is scaled up: soft and cheap
var EASE = 2.5;                       // seconds, time constant for weather crossfades
var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
var still = !!(mq && mq.matches);     // Reduce Motion: paint a static sky, no loops
var LAYERS = ['rain', 'storm', 'snow', 'cloud', 'fog', 'clear', 'gloom'];
var want = {}, have = {}, li;
for (li = 0; li < LAYERS.length; li++) { want[LAYERS[li]] = 0; have[LAYERS[li]] = 0; }
var skyOn = false, dirty = true, lastFrame = 0;
var rainP = [], snowP = [], starP = [], puffs = [], fogB = [];
var strike = -1, nextStrike = 6, boltX = 0.5, meteor = null, nextMeteor = 40;
var sunNow = null, sunAt = 0;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function ramp(a, b, v) { v = clamp((v - a) / (b - a), 0, 1); return v * v * (3 - 2 * v); }
function mix(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')'; }
