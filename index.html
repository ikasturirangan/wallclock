<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wall Clock">
<style>
* { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }
body {
font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight: 200;
-webkit-user-select: none; user-select: none;
-webkit-touch-callout: none;
-webkit-tap-highlight-color: transparent;
cursor: default;
}
.dim { color: #8e8e93; }
#sky { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
#top, #rule, #vibe, #train, #call, #status { z-index: 1; }
#top { position: absolute; left: 5vw; right: 5vw; top: 5vh; height: 36vh; }
#clock { position: absolute; left: 0; top: 0; }
#time { font-size: 15vw; line-height: 1; font-weight: 100; letter-spacing: -0.02em; }
#ampm { font-size: 3.2vw; margin-left: 0.6vw; }
#date { font-size: 2.8vw; margin-top: 1.2vh; }
#weather { position: absolute; right: 0; top: 0; text-align: right; }
#wrow { height: 15vw; white-space: nowrap; }
#wicon { display: inline-block; vertical-align: middle; width: 13vw; height: 13vw; margin-right: 2vw; }
#temp { display: inline-block; vertical-align: middle; font-size: 15vw; line-height: 1; font-weight: 100; }
#wtext { font-size: 2.8vw; margin-top: 1.2vh; }
#wmore { font-size: 2.4vw; margin-top: 0.8vh; }
#rain.wet { color: #64d2ff; }
#rule { position: absolute; left: 5vw; right: 5vw; top: 45vh; height: 1px; background: #2c2c2e; }
#train { position: absolute; left: 5vw; right: 5vw; top: 49vh; bottom: 4vh; }
#line { font-size: 3.2vw; height: 6vw; line-height: 6vw; white-space: nowrap; }
#bullet {
display: inline-block; width: 6vw; height: 6vw; line-height: 6vw; border-radius: 50%;
background: #ff6319; color: #fff; text-align: center;
font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 3.8vw;
margin-right: 1.6vw; vertical-align: top;
}
#vibe { position: absolute; left: 0; right: 0; top: 45vh; margin-top: -4vw; height: 3.2vw; line-height: 3.2vw; text-align: center; font-size: 2.3vw; font-style: italic; color: #aeaeb2; }
#mins.missed { color: #636366; }
#next { position: absolute; left: 0; bottom: 0; white-space: nowrap; line-height: 0.8; }
#mins { font-size: 30vw; font-weight: 700; letter-spacing: -0.03em; }
#unit { font-size: 5vw; margin-left: 1.5vw; }
#later { position: absolute; right: 0; bottom: 1.5vw; text-align: right; }
#laterlabel { font-size: 2.4vw; }
#latervals { font-size: 7vw; font-weight: 200; line-height: 1.15; }
#latervals small { font-size: 2.6vw; color: #8e8e93; margin-left: 0.6vw; }
#latervals i {
display: inline-block; width: 4.4vw; height: 4.4vw; line-height: 4.4vw; border-radius: 50%;
text-align: center; font-style: normal; font-family: Helvetica, Arial, sans-serif;
font-weight: bold; font-size: 2.7vw; margin-right: 1.4vw; vertical-align: 0.9vw;
}
#status { position: absolute; left: 5vw; bottom: 1vh; font-size: 1.6vw; color: #ff453a; }
#call {
position: absolute; left: 5vw; top: 33vh; display: none;
font-size: 2.4vw; color: #30d158; border: 1px solid #30d158; border-radius: 4vw;
padding: 1vw 2.4vw; text-decoration: none;
}
@keyframes spin  { from { -webkit-transform: rotate(0deg); transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
@keyframes drift { 0% { -webkit-transform: translateX(-3px); transform: translateX(-3px); } 50% { -webkit-transform: translateX(3px); transform: translateX(3px); } 100% { -webkit-transform: translateX(-3px); transform: translateX(-3px); } }
@keyframes fall  { 0% { -webkit-transform: translateY(-6px); transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; } 100% { -webkit-transform: translateY(12px); transform: translateY(12px); opacity: 0; } }
@keyframes flash { 0%, 86%, 100% { opacity: 0.25; } 90%, 94% { opacity: 1; } 92% { opacity: 0.3; } }
@keyframes glow  { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
.rays  { -webkit-transform-origin: 50px 50px; transform-origin: 50px 50px; -webkit-animation: spin 40s linear infinite; animation: spin 40s linear infinite; }
.cloud { -webkit-animation: drift 9s ease-in-out infinite; animation: drift 9s ease-in-out infinite; }
.drop  { -webkit-animation: fall 1.1s linear infinite; animation: fall 1.1s linear infinite; }
.flake { -webkit-animation: fall 2.6s linear infinite; animation: fall 2.6s linear infinite; }
.d2 { -webkit-animation-delay: 0.35s; animation-delay: 0.35s; }
.d3 { -webkit-animation-delay: 0.7s; animation-delay: 0.7s; }
.bolt  { -webkit-animation: flash 5s linear infinite; animation: flash 5s linear infinite; }
.moon, .fogl { -webkit-animation: glow 6s ease-in-out infinite; animation: glow 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
.rays, .cloud, .drop, .flake, .bolt, .moon, .fogl { -webkit-animation: none; animation: none; }
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="top">
<div id="clock">
<div><span id="time">--:--</span><span id="ampm" class="dim"></span></div>
<div id="date" class="dim">&nbsp;</div>
</div>
<div id="weather">
<div id="wrow"><span id="wicon"></span><span id="temp">--&deg;</span></div>
<div id="wtext" class="dim">&nbsp;</div>
<div id="wmore" class="dim">&nbsp;</div>
</div>
</div>
<div id="rule"></div>
<div id="vibe"></div>
<div id="train">
<div id="line"><span id="bullet">D</span><span id="where" class="dim">&nbsp;</span></div>
<div id="next"><span id="mins">--</span><span id="unit" class="dim">min</span></div>
<div id="later">
<div id="laterlabel" class="dim">then</div>
<div id="latervals">&nbsp;</div>
</div>
</div>
<a id="call" href="#">Call home</a>
<div id="status"></div>
<script>
(function () {
var data = null;
var gotAt = 0;
var skew = 0;
var shownKind = '';
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
'August', 'September', 'October', 'November', 'December'];
var COLORS = { B: '#ff6319', D: '#ff6319', F: '#ff6319', M: '#ff6319',
N: '#fccc0a', Q: '#fccc0a', R: '#fccc0a', W: '#fccc0a' };
function el(id) { return document.getElementById(id); }
function set(id, text) { var e = el(id); if (e.textContent !== text) { e.textContent = text; } }
var CLOUD = '<path class="cloud" fill="#d1d1d6" d="M30 66h42a14 14 0 0 0 1-28 20 20 0 0 0-38-4 16 16 0 0 0-5 32z"/>';
var SUN = '<g class="rays" stroke="#ffd60a" stroke-width="3" stroke-linecap="round">' +
'<line x1="50" y1="8" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="92"/>' +
'<line x1="8" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="92" y2="50"/>' +
'<line x1="20" y1="20" x2="27" y2="27"/><line x1="73" y1="73" x2="80" y2="80"/>' +
'<line x1="20" y1="80" x2="27" y2="73"/><line x1="73" y1="27" x2="80" y2="20"/></g>' +
'<circle cx="50" cy="50" r="20" fill="#ffd60a"/>';
var MOON = '<path class="moon" fill="#e5e5ea" d="M62 20a32 32 0 1 0 18 44 26 26 0 0 1-18-44z"/>';
function drops(cls, color, round) {
var xs = [34, 50, 66], out = '';
for (var i = 0; i < 3; i++) {
out += round
? '<circle class="' + cls + ' d' + (i + 1) + '" cx="' + xs[i] + '" cy="78" r="3" fill="' + color + '"/>'
: '<line class="' + cls + ' d' + (i + 1) + '" x1="' + xs[i] + '" y1="74" x2="' + (xs[i] - 3) + '" y2="84" stroke="' + color + '" stroke-width="3" stroke-linecap="round"/>';
}
return out;
}
function icon(kind, isDay) {
var inner;
if (kind === 'rain') { inner = CLOUD + drops('drop', '#64d2ff', false); }
else if (kind === 'snow') { inner = CLOUD + drops('flake', '#ffffff', true); }
else if (kind === 'storm') { inner = CLOUD + '<path class="bolt" fill="#ffd60a" d="M52 66l-10 16h8l-4 14 14-20h-8l6-10z"/>'; }
else if (kind === 'cloudy') { inner = CLOUD; }
else if (kind === 'fog') {
inner = '<g class="fogl" stroke="#d1d1d6" stroke-width="4" stroke-linecap="round">' +
'<line x1="20" y1="36" x2="80" y2="36"/><line x1="26" y1="50" x2="74" y2="50"/>' +
'<line x1="20" y1="64" x2="80" y2="64"/></g>';
}
else if (kind === 'partly') {
inner = '<g transform="translate(18 -12) scale(0.7)">' + (isDay ? SUN : MOON) + '</g>' +
'<g transform="translate(-6 10)">' + CLOUD + '</g>';
}
else { inner = isDay ? SUN : MOON; }
return '<svg viewBox="0 0 100 100" width="100%" height="100%">' + inner + '</svg>';
}
function drawClock() {
var d = new Date();
var h = d.getHours(), m = d.getMinutes();
set('ampm', h < 12 ? 'AM' : 'PM');
h = h % 12; if (h === 0) { h = 12; }
set('time', h + ':' + (m < 10 ? '0' : '') + m);
set('date', DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate());
if (d.getHours() === 4 && m === 0 && d.getSeconds() < 2 && Date.now() - loadedAt > 120000) {
location.reload();
}
}
var loadedAt = Date.now();
function drawTrain() {
var fresh = data && data.trains && (Date.now() - gotAt) < 90000;
if (!fresh) {
set('mins', '--'); set('unit', 'min'); el('unit').style.display = '';
set('latervals', ' ');
el('mins').className = '';
set('status', trainErr ? 'No live train data – ' + trainErr : 'Connecting…');
return;
}
set('status', '');
set('where', data.direction + '  ·  ' + data.stop);
var now = (Date.now() + skew) / 1000;
var list = [];
for (var i = 0; i < data.trains.length; i++) {
var mins = Math.floor((data.trains[i].time - now) / 60);
if (mins >= 0) { list.push({ route: data.trains[i].route, mins: mins }); }
}
if (!list.length) {
set('mins', '--'); el('unit').style.display = ''; set('unit', 'no trains listed');
el('mins').className = '';
set('latervals', ' ');
return;
}
var first = list[0];
set('bullet', first.route || 'D');
el('bullet').style.background = COLORS[first.route] || '#ff6319';
el('bullet').style.color = COLORS[first.route] === '#fccc0a' ? '#000' : '#fff';
if (first.mins === 0) {
set('mins', 'Now'); el('unit').style.display = 'none';
} else {
set('mins', String(first.mins)); el('unit').style.display = ''; set('unit', 'min');
}
var walk = data.walkMin || 0;
el('mins').className = (walk && first.mins < walk) ? 'missed' : '';
var html = '', mixed = false, j;
for (j = 1; j < list.length && j < 3; j++) {
if (list[j].route !== first.route) { mixed = true; }
}
for (j = 1; j < list.length && j < 3; j++) {
var bg = COLORS[list[j].route] || '#8e8e93';
html += '<div>' +
(mixed ? '<i style="background:' + bg + ';color:' + (bg === '#fccc0a' ? '#000' : '#fff') + '">' +
list[j].route + '</i>' : '') +
list[j].mins + '<small>min</small></div>';
}
var lv = el('latervals');
if (lv.innerHTML !== html) { lv.innerHTML = html || ' '; }
el('laterlabel').style.visibility = html ? 'visible' : 'hidden';
}
function drawWeather() {
var w = data && data.weather;
if (!w) { return; }
set('temp', (w.temp === null ? '--' : w.temp) + '°');
set('wtext', w.text || ' ');
var key = w.kind + (w.isDay ? 'd' : 'n');
if (key !== shownKind) { el('wicon').innerHTML = icon(w.kind, w.isDay); shownKind = key; }
var vb = el('vibe'), vhtml = w.vibe ? '<span></span>' : '';
if (vb.getAttribute('data-v') !== (w.vibe || '')) {
vb.innerHTML = vhtml;
if (w.vibe) { vb.firstChild.textContent = w.vibe; }
vb.setAttribute('data-v', w.vibe || '');
}
setSky(data.animate ? w.kind : 'off');
var more = '';
if (w.high !== null) { more += 'H ' + w.high + '°   '; }
if (w.low !== null) { more += 'L ' + w.low + '°   '; }
el('wmore').innerHTML = more.replace(/ {3}/g, '&nbsp;&nbsp;&nbsp;') +
'<span id="rain"' + (w.rain >= 40 ? ' class="wet"' : '') + '>Rain ' + w.rain + '%</span>';
}
// ---- Background sky ---------------------------------------------------------
// Back to front: colour wash (follows the real sun), sun glow, stars, clouds,
// fog, rain/snow, lightning. Each layer has an intensity that eases toward a
// target picked from the forecast, so weather changes crossfade over a few
// seconds instead of popping, and a new forecast mid-fade just retargets.
var sky = el('sky'), ctx = sky.getContext('2d');
var wash = document.createElement('canvas'), wctx = wash.getContext('2d');
var W = 0, H = 0, WASH = 8;           // wash renders at 1/8 size and is scaled up: soft and cheap
var EASE = 2.5;                       // seconds, time constant for weather crossfades
var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
var still = !!(mq && mq.matches);     // Reduce Motion: paint a static sky, no loops
var LAYERS = ['rain', 'storm', 'snow', 'cloud', 'fog', 'clear', 'gloom'];
var want = {}, have = {}, li;
for (li = 0; li < LAYERS.length; li++) { want[LAYERS[li]] = 0; have[LAYERS[li]] = 0; }
var skyOn = false, dirty = true, lastFrame = 0;
var rainP = [], snowP = [], starP = [], puffs = [], fogB = [];
var strike = -1, nextStrike = 6, boltX = 0.5, meteor = null, nextMeteor = 40;
var sunNow = null, sunAt = 0;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function ramp(a, b, v) { v = clamp((v - a) / (b - a), 0, 1); return v * v * (3 - 2 * v); }
function mix(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')'; }
function radial(size, stops) {
var c = document.createElement('canvas');
c.width = c.height = size;
var g = c.getContext('2d'), r = size / 2;
var grad = g.createRadialGradient(r, r, 0, r, r, r);
for (var i = 0; i < stops.length; i++) { grad.addColorStop(stops[i][0], stops[i][1]); }
g.fillStyle = grad;
g.fillRect(0, 0, size, size);
return c;
}
function makeSun(golden) {
return radial(512, golden ? [
[0,    'rgba(255,240,214,0.85)'],
[0.05, 'rgba(255,220,164,0.75)'],
[0.12, 'rgba(255,180,92,0.48)'],
[0.26, 'rgba(255,136,54,0.22)'],
[0.48, 'rgba(240,96,40,0.08)'],
[0.75, 'rgba(200,70,40,0.025)'],
[1,    'rgba(200,70,40,0)']
] : [
[0,    'rgba(255,252,240,0.85)'],
[0.05, 'rgba(255,242,204,0.75)'],
[0.12, 'rgba(255,222,148,0.45)'],
[0.26, 'rgba(255,196,104,0.2)'],
[0.48, 'rgba(255,170,90,0.075)'],
[0.75, 'rgba(120,160,220,0.025)'],
[1,    'rgba(120,160,220,0)']
]);
}
function makeCloud() {               // several overlapping soft blobs, so it isn't one oval
var c = document.createElement('canvas');
c.width = 512; c.height = 256;
var g = c.getContext('2d');
var b = radial(256, [[0, 'rgba(214,216,224,0.9)'], [0.55, 'rgba(214,216,224,0.35)'], [1, 'rgba(214,216,224,0)']]);
var spots = [[60, 70, 220], [170, 30, 250], [270, 60, 230], [120, 110, 200], [230, 120, 190]];
for (var i = 0; i < spots.length; i++) {
g.drawImage(b, spots[i][0], spots[i][1] - 40, spots[i][2], spots[i][2] * 0.62);
}
return c;
}
var flakeImg = radial(32, [[0, 'rgba(255,255,255,1)'], [0.45, 'rgba(255,255,255,0.75)'], [1, 'rgba(255,255,255,0)']]);
var hazeImg = radial(256, [[0, 'rgba(255,200,130,1)'], [1, 'rgba(255,200,130,0)']]);
var fogImg = radial(256, [[0, 'rgba(196,200,210,1)'], [0.6, 'rgba(196,200,210,0.45)'], [1, 'rgba(196,200,210,0)']]);
var cloudImg = makeCloud(), sunCool = makeSun(false), sunWarm = makeSun(true);
// Where the sun is right now, from LAT/LON (low-precision solar position, plenty for a backdrop).
function sunPos(ms) {
var rad = Math.PI / 180, d = ms / 86400000 - 10957.5;           // days since J2000
var g = (357.529 + 0.98560028 * d) * rad;
var L = (280.459 + 0.98564736 * d + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
var e = (23.439 - 0.00000036 * d) * rad;
var ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
var dec = Math.asin(Math.sin(e) * Math.sin(L));
var ha = (280.46061837 + 360.98564736629 * d + LON) * rad - ra;
var lat = LAT * rad;
var elev = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
var az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(lat) - Math.tan(dec) * Math.cos(lat));
return { el: elev / rad, az: az / rad };                       // az: 0 south, -90 east, +90 west
}
// Screen position for the sun, as if the screen faces south: it rises at the
// left edge, crosses just above the top at midday and sets at the right edge.
function sunAnchor(p) {
var lit = ramp(-12, 0, p.el);
var x = W * (0.5 + clamp(p.az / 80, -1, 1) * 0.62);
var y = -H * 0.06 + (1 - clamp(p.el / 35, 0, 1)) * H * 0.5;
return { x: W * 0.5 + (x - W * 0.5) * lit, y: y * lit - H * 0.1 * (1 - lit) };
}
// Wash colours by sun elevation in degrees: [near the sun, ambient, low/horizon].
var PALETTE = [
[-18, [[12, 22, 54],   [18, 16, 48],   [6, 18, 36]]],     // night
[-8,  [[28, 40, 104],  [48, 32, 98],   [22, 36, 84]]],    // blue hour
[-1,  [[126, 66, 122], [66, 40, 108],  [196, 92, 78]]],   // dawn / dusk
[6,   [[255, 150, 72], [140, 76, 108], [232, 112, 60]]],  // golden hour
[18,  [[56, 128, 228], [30, 88, 186],  [86, 160, 236]]]   // day
];
var GLOOM = [[88, 96, 112], [64, 68, 82], [76, 82, 98]];  // overcast slate
function skyColors(elev) {
var i = 0, j, out = [];
while (i < PALETTE.length - 2 && elev > PALETTE[i + 1][0]) { i++; }
var a = PALETTE[i], b = PALETTE[i + 1], k = ramp(a[0], b[0], elev);
var dim = 0.3 + 0.7 * ramp(-10, 10, elev), g = have.gloom * 0.85;
for (j = 0; j < 3; j++) {
out.push(mix(mix(a[1][j], b[1][j], k), [GLOOM[j][0] * dim, GLOOM[j][1] * dim, GLOOM[j][2] * dim], g));

}
function blob(x, y, r, c, a) {
var g = wctx.createRadialGradient(x, y, 0, x, y, r);
g.addColorStop(0, rgba(c, a));
g.addColorStop(0.5, rgba(c, a * 0.45));
g.addColorStop(1, rgba(c, 0));
wctx.fillStyle = g;
wctx.fillRect(0, 0, wash.width, wash.height);
}
function paintWash(t, sun, up) {
var s = 1 / WASH, c = skyColors(sunNow.el);
wctx.globalCompositeOperation = 'source-over';
wctx.clearRect(0, 0, wash.width, wash.height);
wctx.globalCompositeOperation = 'lighter';
blob(sun.x * s, sun.y * s, W * 0.95 * s, c[0], 0.3 + 0.12 * up);
blob(W * (0.12 + 0.08 * Math.sin(t / 71)) * s, H * (1.02 + 0.05 * Math.sin(t / 53)) * s, W * 0.75 * s, c[2], 0.3);
blob(W * (0.86 + 0.07 * Math.sin(t / 89 + 2)) * s, H * (0.58 + 0.1 * Math.cos(t / 67)) * s, W * 0.6 * s, c[1], 0.26);
}
function seed() {
var i, z;
rainP = []; snowP = []; starP = []; puffs = []; fogB = [];
for (i = 0; i < 110; i++) {
z = Math.random();
rainP.push({ on: false, x: 0, y: 0, z: z, b: Math.min(2, Math.floor(z * 3)), len: 9 + z * 28, v: 430 + z * 560 });
}
for (i = 0; i < 80; i++) {
z = Math.random();
snowP.push({ on: false, x: 0, y: 0, z: z, r: 1.6 + z * 4.2, v: 16 + z * 46, ph: Math.random() * 6.28, sw: 0.5 + Math.random() * 0.9 });
}
for (i = 0; i < 70; i++) {
starP.push({ x: Math.random() * W, y: Math.random() * H * 0.92, r: 2 + Math.random() * Math.random() * 6,
ph: Math.random() * 6.28, sp: 0.3 + Math.random() * 1.1 });
}
for (i = 0; i < 8; i++) {                       // first four far (small, slow, faint), last four near
var near = i >= 4;
puffs.push({ x: Math.random() * W * 1.4, y: Math.random() * H * 0.75 - 60,
